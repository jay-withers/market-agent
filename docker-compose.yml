# The local loop: Postgres with the schema baked in, plus the API, needing no
# Azure at all.
#
# "Local" is not "offline", and the distinction matters for the agent service.
# The API only reads Postgres, so it genuinely runs in isolation. The agent
# still calls Alpaca for prices and news, Frankfurter for the rate, and
# DeepSeek for both model stages — real requests, and the DeepSeek ones are
# billed. The agent submits Alpaca paper orders by default; set DRY_RUN=true
# to record simulated fills without submitting orders.
#
# Secrets come from Key Vault, not from a file. The image has no `az`, so it
# cannot authenticate on its own — instead `make run-agent` fetches a
# short-lived, Key Vault-scoped token with your az login and passes it in as
# AZURE_KEYVAULT_TOKEN. It expires in about an hour and unlocks nothing else,
# which beats writing four long-lived API keys into a .env. A .env still works
# if you prefer it, or if you have no Azure access at all.
#
# Deliberately free of bind mounts. The Docker daemon here runs on the host
# (docker-outside-of-docker), so a relative bind mount means a *host* path and
# fails from inside the dev container; build contexts are sent by the client and
# work from either side.
#
# Works because settings.secret() reads an environment variable before falling
# back to Key Vault, and db.py uses password authentication when
# POSTGRES_PASSWORD is set instead of an Entra token. Put the API keys in a
# local .env — see .env.example.
#
# Built for the host's native architecture on purpose. The deployable image
# must be linux/amd64 (see the Dockerfile), but forcing that here would run
# every local container under emulation for no benefit.

name: marketagent

services:
  db:
    # Built rather than pulled so the migrations can be baked in. A bind mount
    # of ./sql would be resolved by the daemon on the host, where the dev
    # container's /workspaces path does not exist — see docker/Dockerfile.db.
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    environment:
      POSTGRES_PASSWORD: local
      POSTGRES_DB: marketagent
    ports:
      # Published on the *host*. From inside the dev container reach it at the
      # container's bridge IP, or at host.docker.internal:5432.
      - "5432:5432"
    volumes:
      # A single mount at the parent directory, not .../data: postgres 18's
      # image refuses to start against the old data path, wanting a
      # major-version-specific subdirectory of this one instead.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/marketagent
    command: ["api"]
    environment:
      ENVIRONMENT: local
      POSTGRES_HOST: db
      POSTGRES_DATABASE: marketagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local
      DRY_RUN: "${DRY_RUN:-false}"
      LOG_LEVEL: INFO
      # Empty unless the caller exports them; settings.secret() reads an
      # environment variable first either way, so an empty vault URI simply
      # means "expect the keys in the environment".
      KEY_VAULT_URI: "${KEY_VAULT_URI:-}"
      AZURE_KEYVAULT_TOKEN: "${AZURE_KEYVAULT_TOKEN:-}"
    env_file:
      # Optional: the API needs no API key, so this is only here so one file
      # serves every service.
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: ./apps/dashboard
    environment:
      # The browser talks to the API directly, so this must be an address the
      # *browser* can reach — not the compose service name. Published ports land
      # on the Docker host, which is where a browser on that host looks.
      API_ORIGIN: "${API_ORIGIN:-http://localhost:8000}"
      # DASHBOARD_PASSCODE gates the dashboard behind the passcode screen in
      # Azure, and API_TOKEN is what it would forward to the API as a bearer
      # token if the API were guarding itself too. Both unset here on purpose:
      # leaving them out is what keeps the local dashboard and API open,
      # matching the opt-in shape of every other secret in this repo. The
      # local `api` service above never sets API_REQUIRE_TOKEN either, so
      # there is nothing for a token to satisfy.
      #
      # Set it to try the gate locally:
      #   DASHBOARD_PASSCODE=LOCAL-TEST-CODE docker compose up -d dashboard
      DASHBOARD_PASSCODE: "${DASHBOARD_PASSCODE:-}"
    ports:
      - "8080:8080"
    depends_on:
      - api

  # Not started by default: `docker compose run --rm agent` runs it once. It is
  # a scheduled job rather than a service, and a restarting container would
  # trade repeatedly.
  # PORTFOLIO selects which of the two accounts a run trades as — set by
  # `make run-agent PORTFOLIO=dynamic-500`; defaults to static-100.
  agent:
    build:
      context: ./apps/marketagent
    command: ["agent", "--trigger", "manual", "--portfolio", "${PORTFOLIO:-static-100}"]
    profiles: ["jobs"]
    environment:
      ENVIRONMENT: local
      POSTGRES_HOST: db
      POSTGRES_DATABASE: marketagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local
      DRY_RUN: "${DRY_RUN:-false}"
      KEY_VAULT_URI: "${KEY_VAULT_URI:-}"
      AZURE_KEYVAULT_TOKEN: "${AZURE_KEYVAULT_TOKEN:-}"
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

  # Also on demand: `docker compose run --rm weekly`. Reads only — no market
  # data, no broker — so the one thing it costs is a single Sonnet call.
  # Covers both accounts in one run; no PORTFOLIO to set.
  weekly:
    build:
      context: ./apps/marketagent
    command: ["weekly"]
    profiles: ["jobs"]
    environment:
      ENVIRONMENT: local
      POSTGRES_HOST: db
      POSTGRES_DATABASE: marketagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local
      KEY_VAULT_URI: "${KEY_VAULT_URI:-}"
      AZURE_KEYVAULT_TOKEN: "${AZURE_KEYVAULT_TOKEN:-}"
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

  # `docker compose run --rm sync`. Read-only against Alpaca, same PORTFOLIO
  # convention as agent.
  sync:
    build:
      context: ./apps/marketagent
    command: ["sync", "--portfolio", "${PORTFOLIO:-static-100}"]
    profiles: ["jobs"]
    environment:
      ENVIRONMENT: local
      POSTGRES_HOST: db
      POSTGRES_DATABASE: marketagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local
      KEY_VAULT_URI: "${KEY_VAULT_URI:-}"
      AZURE_KEYVAULT_TOKEN: "${AZURE_KEYVAULT_TOKEN:-}"
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

  # `docker compose run --rm rebalance`. Touches dynamic-500 only — see
  # jobs/rebalance.py — and calls no Alpaca/DeepSeek API, only Wikipedia.
  rebalance:
    build:
      context: ./apps/marketagent
    command: ["rebalance"]
    profiles: ["jobs"]
    environment:
      ENVIRONMENT: local
      POSTGRES_HOST: db
      POSTGRES_DATABASE: marketagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local
      KEY_VAULT_URI: "${KEY_VAULT_URI:-}"
      AZURE_KEYVAULT_TOKEN: "${AZURE_KEYVAULT_TOKEN:-}"
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
