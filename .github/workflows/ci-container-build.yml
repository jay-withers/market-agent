name: ci-container-build

# Builds both application images on a pull request, without pushing anything.
#
# Until this existed, a broken Dockerfile was discovered by whoever next ran
# `make build` — after merge, on their laptop, usually while trying to deploy
# something else. Both images are built from the app source in this repo, so a
# dependency bump or a moved file breaks the image without breaking any test.
#
# The runners are amd64, which is what Container Apps runs, so these builds are
# native. A local `make build` on Apple Silicon has to emulate amd64 through
# QEMU, which is both slow and a different code path — CI proving the image
# builds on the target architecture is the point, not a side effect.
on:
  pull_request:
    branches: [main]
    paths:
      - apps/**
      - .github/workflows/ci-container-build.yml

permissions:
  contents: read

jobs:
  build:
    strategy:
      # Both images are reported, rather than the first failure hiding whether
      # the other one is also broken.
      fail-fast: false
      matrix:
        image: [investagent, dashboard]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # push is false: a pull request must never publish an image, and the
      # GITHUB_TOKEN on a fork PR could not push anyway. The cache is shared
      # with cd-publish by scope, so a merge usually reuses the PR's layers.
      - name: Build ${{ matrix.image }} for linux/amd64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/${{ matrix.image }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
