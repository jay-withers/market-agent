name: ci-container-build

# Builds both application images on a pull request, without pushing anything.
#
# Until this existed, a broken Dockerfile was discovered by whoever next ran
# `make build` — after merge, on their laptop, usually while trying to deploy
# something else. Both images are built from the app source in this repo, so a
# dependency bump or a moved file breaks the image without breaking any test.
#
# The runners are amd64, which is what Container Apps runs, so these builds are
# native. A local `make build` on Apple Silicon has to emulate amd64 through
# QEMU, which is both slow and a different code path — CI proving the image
# builds on the target architecture is the point, not a side effect.
#
# The mechanics live in jay-withers/workflows' docker.yml, which cd-publish
# also calls. That shared call is what keeps this honest: when the two were
# separate hand-written workflows they could drift on context, platform or
# cache scope, and a green pull request would then prove less about the release
# than it looked like it did. Here the only difference is `push`.
on:
  pull_request:
    branches: [main]
    paths:
      - apps/**
      - .github/workflows/ci-container-build.yml

permissions:
  contents: read

jobs:
  # push is left at its default of false: a pull request must never publish an
  # image, and a fork's GITHUB_TOKEN could not push anyway. The cache is shared
  # with cd-publish by image name, so a merge usually reuses the PR's layers.
  build:
    permissions:
      contents: read
    uses: jay-withers/workflows/.github/workflows/docker.yml@0a18e55d654e22fa54c4085547e4389896be6b7f # v1.4.0
    with:
      images: |
        [{"name": "investagent", "context": "apps/investagent"},
         {"name": "dashboard", "context": "apps/dashboard"}]
