name: cd-publish

# Publishes the application images to GHCR for a given tag. Invoked by cd-tag
# after a version bump, or manually to (re)publish an existing tag.
#
# This replaces `make build && make push` from a laptop as the release path.
# That worked, but it published whatever was in the working tree, tagged with
# the local git SHA, built through QEMU emulation because the dev host is arm64
# and Container Apps is amd64-only. Here the runner is natively amd64 and the
# source is an immutable tag, so what is published is exactly what was merged.
# The Makefile targets stay for local iteration.
#
# The build itself is jay-withers/workflows' docker.yml, the same call
# ci-container-build makes with `push` left false. This file is the release
# entrypoint and nothing else: it exists as a workflow of its own rather than
# folding into cd-tag because the workflow_dispatch trigger is the documented
# way to re-publish an existing tag after a failed build, without minting a new
# version.
#
# Two tags are pushed for each image, both immutable:
#
#   vX.Y.Z    the release this came from, for a deploy someone has to reason
#             about later
#   <sha>     the short commit SHA, which is what the Makefile's IMAGE_TAG
#             defaults to and what existing deploys and agent_runs rows record
#
# Neither is ever moved. Container Apps only creates a revision when the
# template changes, so re-pushing a moving tag would deploy nothing and report
# success — which is the failure mode this avoids by construction.
on:
  workflow_call:
    inputs:
      version:
        description: Git tag to publish (e.g. v1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing git tag to publish (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  # `ref` is the tag rather than the default checkout, and that is what makes
  # tag-with-sha correct: on a workflow_call github.sha is this branch's head,
  # not the tag, so resolving the short SHA from anything else would record a
  # commit that was never built.
  #
  # packages: write has to be granted here — docker.yml declares no permissions
  # of its own precisely so a caller can hand it more than read.
  publish:
    permissions:
      contents: read
      packages: write
    uses: jay-withers/workflows/.github/workflows/docker.yml@e37b7fe5708196c79e0469510f5c50b26d157194 # v1.4.1
    with:
      images: |
        [{"name": "marketagent", "context": "apps/marketagent"},
         {"name": "dashboard", "context": "apps/dashboard"}]
      ref: ${{ inputs.version }}
      push: true
      tags: ${{ inputs.version }}
      tag-with-sha: true
      summary-note: Deploy with `make deploy IMAGE_TAG=${{ inputs.version }}`.
