name: ci-python

# Runs the Python test suite on a pull request.
#
# Until this existed, nothing in CI ran pytest at all. ci-pre-commit lints the
# code with ruff and ci-container-build proves the images compile, but neither
# executes a single test — so the risk engine, the one component deciding what
# the agent is permitted to trade, was covered only by whoever remembered to
# run `make test` before pushing.
#
# That gap matters most for the changes nobody reads: renovate.json sets
# autoApprove, so a dependency bump reaches main without a human. A psycopg,
# pydantic or anthropic release that broke the engine or the request shapes
# would have merged green.
#
# The mechanics live in jay-withers/workflows, so every repo of ours gets the
# same job and a fix lands once. Only what is specific to this repo is here.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # For the coverage comment below. The reusable workflow declares no
  # permissions of its own precisely so this is reachable — a called workflow
  # can never hold more than its caller grants.
  pull-requests: write

jobs:
  test:
    # `extras: dev` is the input that matters: pytest sits in
    # [project.optional-dependencies] and `uv run` installs dependency groups
    # but not extras, so without it the run fails with a bare "Failed to spawn:
    # pytest" after a successful-looking install — and only in CI, because
    # locally `make install` has already put it in the venv.
    #
    # python-version matches the python:3.14 base in apps/marketagent/Dockerfile,
    # so a pass here is a pass on the interpreter Container Apps runs.
    #
    # The reusable workflow runs unfiltered by path, which is deliberate: the
    # suite takes seconds, and a required check skipped by a path filter never
    # reports, blocking a pull request rather than passing it.
    uses: jay-withers/workflows/.github/workflows/python.yml@a5015ee2aed310376c5a0a1b19ced327dfd4fbd4 # v1.4.5
    with:
      working-directory: apps/marketagent
      python-version: "3.14"
      extras: dev
      # Reported, never gated. The figure is bimodal: the pure modules — the
      # risk engine, the models, the benchmark arithmetic — sit at 100%, while
      # everything behind a psycopg connection sits far lower, because
      # repository.py's SQL has no database to run against in CI. A
      # --cov-fail-under over that mixture would be met by mocking the
      # connection, which asserts the mock rather than the behaviour.
      #
      # The corollary is that it has to be *seen* instead, which is what the
      # comment is for: a number nobody is shown and nothing enforces is not a
      # signal. The job summary carries it too.
      #
      # pytest-cov is not in the dev extra and does not need to be — the
      # reusable workflow injects it with `uv run --with`, an ephemeral overlay
      # that costs this repo no dependency and no lockfile churn, and that does
      # not invalidate the --locked run.
      coverage: marketagent
      coverage-pr-comment: true
      # repository.py and queries.py are hand-written SQL, and without a server
      # for it to run against none of it was executed by anything but the
      # deployed job at 06:00 UTC. The tests skip when POSTGRES_TEST_DSN is
      # absent, which this input is what sets — so a clone with no Docker still
      # runs `make test`, and CI runs the whole suite.
      #
      # 18-alpine matches docker/Dockerfile.db, so the local loop and CI apply
      # the same migrations to the same major version.
      postgres: "18-alpine"
