[project]
name = "investagent"
version = "0.1.0"
description = "AI paper-trading agent: news and market data in, risk-checked simulated trades out"
requires-python = ">=3.12"

# One package, one image, three entrypoints (api, agent, summary): they share
# the risk engine, the database layer, the broker client and the LLM client, so
# splitting them would mean three builds of near-identical layers.
#
# Dependencies are added as the modules that need them land, rather than
# declared up front — anthropic, fastapi and httpx arrive with the agent job,
# the API and the market data client respectively.
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "psycopg[binary,pool]>=3.2",
  "azure-identity>=1.19",
  "azure-keyvault-secrets>=4.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investagent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # import sorting
  "UP",      # pyupgrade
  "B",       # bugbear
  "SIM",     # simplify
  "RUF",
]

# B008 flags a call in an argument default because a mutable default is shared
# across calls. Decimal is immutable, so `amount=D(50)` is safe and is by far
# the most readable way to write a test fixture.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["decimal.Decimal", "D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Money is Decimal throughout and a float creeping in would silently reintroduce
# the rounding the schema's NUMERIC columns exist to avoid, so the warning that
# catches it is an error here.
filterwarnings = ["error"]
