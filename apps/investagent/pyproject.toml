[project]
name = "investagent"
version = "0.1.0"
description = "AI paper-trading agent: news and market data in, risk-checked simulated trades out"
requires-python = ">=3.12"

# One package, one image, three entrypoints (api, agent, summary): they share
# the risk engine, the database layer, the broker client and the LLM client, so
# splitting them would mean three builds of near-identical layers.
#
# Dependencies are added as the modules that need them land, rather than
# declared up front — fastapi and httpx arrive with the API and the market data
# client respectively.
dependencies = [
  "anthropic>=1.3",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "psycopg[binary,pool]>=3.2",
  "azure-identity>=1.19",
  "azure-keyvault-secrets>=4.9",
  "httpx>=0.28",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "markdown>=3.7",
  # Telemetry. The distro brings the exporter plus FastAPI, logging and Azure
  # SDK instrumentation; httpx is separate because the distro does not carry it,
  # and it is what turns the Alpaca, news and FX calls into dependency spans.
  "azure-monitor-opentelemetry>=1.6",
  "opentelemetry-instrumentation-httpx>=0.50b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

# What Terraform's `command = ["investagent"]` resolves to.
[project.scripts]
investagent = "investagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investagent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # import sorting
  "UP",      # pyupgrade
  "B",       # bugbear
  "SIM",     # simplify
  "RUF",
]

# B008 flags a call in an argument default because a mutable default is shared
# across calls. Decimal is immutable, so `amount=D(50)` is safe and is by far
# the most readable way to write a test fixture. FastAPI's Depends/Query/Header
# are the framework's documented idiom and are the whole way dependencies and
# parameter validation are declared — B008 on them is a false positive, not a
# style disagreement.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "decimal.Decimal",
  "D",
  "fastapi.Body",
  "fastapi.Depends",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Money is Decimal throughout and a float creeping in would silently reintroduce
# the rounding the schema's NUMERIC columns exist to avoid, so the warning that
# catches it is an error here.
filterwarnings = ["error"]
