# Serves the built SPA on 8080.
#
# 8080, not 80: the container runs unprivileged, and a non-root process cannot
# bind a port below 1024.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The passcode gate's rejection renders the login form rather than the
    # browser's own credential dialog — which is the whole point of moving off
    # Basic Auth, since that dialog always asks for a username too.
    #
    # An error page, not a redirect: the request keeps its original URL, so a
    # deep link to /holdings still goes to /holdings once the cookie is set and
    # the page reloads. The status stays 401, which is the honest answer and
    # keeps anything scripted from reading the form as success.
    error_page 401 /login.html;

    # `internal` so it is only ever reachable as that error body. It is
    # deliberately outside the auth check — a login page behind the gate it
    # exists to open is a loop — and it carries no secret: the passcode is
    # compared by nginx, never sent to the browser.
    location = /login.html {
        internal;
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # The runtime configuration must never be cached. It is rendered from
    # $API_ORIGIN when the container starts, so a cached copy from a previous
    # revision would point the dashboard at the wrong API and look like a CORS
    # bug rather than a stale file.
    location = /config.json {
        # Rendered by the entrypoint: empty when DASHBOARD_PASSCODE is
        # unset, so this is a no-op unless the gate is configured. Not
        # inherited from the server block on purpose — an inherited `if` and a
        # sibling location's own directives interact in ways worth not relying
        # on, so each protected location includes it explicitly instead.
        include /tmp/dashboard/auth.conf;

        # Aliased out of the document root: it is generated at start-up by a
        # process that cannot write to the root, and it must never be cached —
        # a stale copy from a previous revision points the dashboard at the
        # wrong API and looks like a CORS bug rather than a stale file.
        alias /tmp/dashboard/config.json;
        default_type application/json;
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # Vite emits content-hashed asset names, so these are safe to cache hard.
    location /assets/ {
        include /tmp/dashboard/auth.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No /healthz to the API: this is nginx's own liveness, answered from
    # memory. A probe that reached the API would restart the dashboard whenever
    # the API blipped. Deliberately outside the auth check too — Container
    # Apps' liveness probe cannot present a credential, the same reason the
    # API's own health endpoints sit outside its bearer gate.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        include /tmp/dashboard/auth.conf;
        try_files $uri $uri/ /index.html;
    }
}
